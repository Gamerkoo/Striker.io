<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Striker.io</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
:root{--void:#05061a;--cliff:#05061a;--ink:#10153a;--panel:rgba(255,255,255,.9);--accent:#f26a00;--onaccent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--void:#0d1128;--cliff:#070a1a;--ink:#f4f6ff;--panel:rgba(13,17,40,.9);--accent:#ffb020;--onaccent:#10153a}}
:root[data-theme="dark"]{--void:#0d1128;--cliff:#070a1a;--ink:#f4f6ff;--panel:rgba(13,17,40,.9);--accent:#ffb020;--onaccent:#10153a}
html{height:100%;background:var(--void);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--void);color:var(--ink);font-family:"Black Han Sans",system-ui,sans-serif;overflow:hidden;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
#box{background:var(--panel);border-radius:18px;padding:26px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
h1{margin:0 0 6px;font-size:42px;font-weight:400;letter-spacing:.5px}
p{margin:0 0 16px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.5;opacity:.85}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 16px system-ui,sans-serif;text-align:center;margin-bottom:12px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--onaccent);font:400 22px "Black Han Sans",system-ui,sans-serif;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div id="box">
<h1 id="t">Striker.io</h1>
<p id="s">공을 차서 상대를 낭떠러지로 밀어내세요.<br>화면을 드래그하면 조이스틱이 나타납니다. 스틱으로 이동하며 공을 드리블하고, 오른쪽 아래 공 버튼(스페이스바)으로 바라보는 방향에 슛, 꾹 누르면 차징해서 파워슛을 날립니다. 굴러다니는 공은 누구 것이든 달려가서 주울 수 있어요. 가장자리 밖으로 나가면 그대로 추락하니 조심하세요.</p>
<input id="nm" maxlength="10" placeholder="닉네임" autocomplete="off">
<button id="go">경기 시작</button>
</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),T={};
let W,H,DPR=1;
function readTheme(){const s=getComputedStyle(document.documentElement);['void','cliff','ink','accent'].forEach(k=>T[k]=s.getPropertyValue('--'+k).trim());T.ink='#f4f6ff'}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR}
readTheme();resize();addEventListener('resize',resize);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme);

const R=480,rnd=(a,b)=>Math.random()*(b-a)+a;
const COL=['#ff5d73','#ffb020','#9b7bff','#2fd0a0','#ff8ad8','#7be0ff','#c6e84a','#ff8a4d'];
const NAMES=['Messi','Rocket','Tiger','Blitz','Ninja','Comet','Bomber','Storm','Wolf','Goal','Kicker','Hero'];
let P=[],parts=[],feed=[],player=null,state='menu',time=0,best=0;
const cam={x:0,y:0,s:1,shake:0},stick={x:0,y:0,id:null,bx:0,by:0,sx:0,sy:0},keys={},SR=58;
let lock=null,pressT=-9;const BTR=46,chg={on:false,t:0,id:null};
try{best=+localStorage.getItem('striker_best')||0}catch(e){}

const f=p=>Math.min(1.08**p.kills,2.6),pw=p=>1.15**p.kills;
function mk(name,color,bot){
  const p={name,color,bot,x:0,y:0,vx:0,vy:0,kx:0,ky:0,kills:0,r:18,alive:true,fall:0,last:null,lastT:0,tx:0,ty:0,aim:0,cd:1,respawn:0};
  place(p);return p;
}
function place(p){
  const a=rnd(0,6.28),d=rnd(60,R*.6);
  Object.assign(p,{x:Math.cos(a)*d,y:Math.sin(a)*d,vx:0,vy:0,kx:0,ky:0,kills:0,alive:true,fall:0,last:null,cd:rnd(.8,2),run:rnd(0,6),mv:0,kick:0});
  p.ball={st:'held',x:p.x,y:p.y,vx:0,vy:0,d:0,hit:false,lt:0,trail:[]};
}
for(let i=0;i<8;i++)P.push(mk(NAMES[i],COL[i],true));

function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(sp*.3,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.3,.7),m:.7,c,s:rnd(2,5)})}}
function shoot(p,ch=0){
  const b=p.ball;if(!p.alive||p.fall||b.st!=='held')return;
  b.st='fly';b.d=0;b.hit=false;b.trail=[];b.lt=0;p.kick=.24;
  const s0=1150*(1+ch*.3);b.pw=1+ch*.45;b.vx=Math.cos(p.aim)*s0;b.vy=Math.sin(p.aim)*s0;
  const rc=70+ch*150;p.kx-=Math.cos(p.aim)*rc;p.ky-=Math.sin(p.aim)*rc;
  burst(b.x,b.y,6+Math.round(ch*18),ch>.6?p.color:'#fff',160+ch*300);if(p===player&&ch>.3)cam.shake=Math.max(cam.shake,6+ch*10);
}
function die(p){
  p.alive=false;p.ball.st='held';
  const k=p.last&&p.last.alive&&p.last!==p&&time-p.lastT<6?p.last:null;
  if(k){k.kills++;feed.push({t:time,s:k.name+' ▶ '+p.name,c:k.color});if(k===player)cam.shake=Math.max(cam.shake,16)}
  else feed.push({t:time,s:p.name+' 추락',c:p.color});
  if(p===player){
    state='over';
    if(p.kills>best){best=p.kills;try{localStorage.setItem('striker_best',best)}catch(e){}}
    document.getElementById('t').textContent='추락!';
    document.getElementById('s').innerHTML='처치 <b>'+p.kills+'</b> · 최고 기록 <b>'+best+'</b><br>다시 도전해 더 큰 슈터가 되어보세요.';
    document.getElementById('go').textContent='다시 시작';
    ov.classList.remove('hide');
  }else p.respawn=2.5;
}
function ai(p,dt){
  let t=null,td=1e9;
  for(const q of P){if(q===p||!q.alive||q.fall)continue;const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<td){td=d;t=q}}
  const dc=Math.hypot(p.x,p.y);
  p.cd-=dt;
  if(t)p.aim=Math.atan2(t.y-p.y,t.x-p.x);
  if(dc>R*.7&&p.ball.st==='held'){p.tx=-p.x*.4;p.ty=-p.y*.4}
  else if(t&&p.ball.st==='held'){
    p.tx=t.x;p.ty=t.y;
    if(td<400&&p.cd<=0){
      const lead=.22;p.aim=Math.atan2(t.y+(t.vy+t.kx*0)*lead-p.y,t.x+t.vx*lead-p.x)+rnd(-.14,.14);
      shoot(p);p.cd=rnd(1.3,2.6);
    }
  }else{let b=p.ball;if(b.st!=='held'){let bd=1e9;for(const q of P){const o=q.ball;if(!q.alive||q.fall||o.st==='held')continue;const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<bd){bd=d;b=o}}}const m=Math.hypot(b.x,b.y),k=m>R*.9?R*.9/m:1;p.tx=b.x*k;p.ty=b.y*k}
}
function upd(p,dt){
  if(!p.alive){if(p.bot){p.respawn-=dt;if(p.respawn<=0)place(p)}return}
  const kd=Math.exp(-dt*3);
  if(p.fall>0){
    p.fall+=dt;p.kx*=kd;p.ky*=kd;p.x+=p.kx*dt;p.y+=p.ky*dt;
    if(p.fall>1)die(p);return;
  }
  p.r=18*f(p);
  if(p.bot)ai(p,dt);
  const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy)||1;
  const sp=Math.min(d*4,235/(1+(f(p)-1)*.35)*(p.bot?.82:1));
  const e=Math.min(1,dt*9);
  p.vx+=(dx/d*sp-p.vx)*e;p.vy+=(dy/d*sp-p.vy)*e;
  p.kx*=kd;p.ky*=kd;
  const spd=Math.hypot(p.vx,p.vy);p.mv=Math.min(1,spd/140);if(spd>12)p.run+=dt*(6+spd/20);if(p.kick>0)p.kick-=dt;
  p.x+=(p.vx+p.kx)*dt;p.y+=(p.vy+p.ky)*dt;
  if(Math.hypot(p.x,p.y)>R){p.fall=.001;p.vx=p.vy=0}
  ballUpd(p,dt);
}
function ballUpd(p,dt){
  const b=p.ball,br=9*f(p);
  if(b.st==='held'){
    const fw=p.r+br+3+(.5+.5*Math.sin(p.run*1.1))*p.r*.5*p.mv,lat=Math.sin(p.run*.55)*p.r*.3*p.mv,ca=Math.cos(p.aim),sa=Math.sin(p.aim);
    b.x=p.x+ca*fw-sa*lat;b.y=p.y+sa*fw+ca*lat;b.trail.length=0;b.lt=0;return;
  }
  const v0=Math.hypot(b.vx,b.vy);
  if(v0>200){b.trail.push({x:b.x,y:b.y});if(b.trail.length>16)b.trail.shift()}else if(b.trail.length)b.trail.shift();
  const fr=Math.exp(-dt*1.7);b.vx*=fr;b.vy*=fr;b.x+=b.vx*dt;b.y+=b.vy*dt;b.lt+=dt;
  const dc=Math.hypot(b.x,b.y);
  if(dc>R-br){
    const nx=b.x/dc,ny=b.y/dc,dot=b.vx*nx+b.vy*ny;
    b.vx=(b.vx-2*dot*nx)*.9;b.vy=(b.vy-2*dot*ny)*.9;b.x=nx*(R-br);b.y=ny*(R-br);
    burst(b.x,b.y,5,'#fff',140);if(p===player)cam.shake=Math.max(cam.shake,4);
  }
  const v=Math.hypot(b.vx,b.vy);
  let g=null;
  if(v<420&&Math.hypot(p.x-b.x,p.y-b.y)<p.r+br+26)g=p;
  else if(v<320)for(const q of P){if(q!==p&&q.alive&&!q.fall&&q.ball.st!=='held'&&Math.hypot(q.x-b.x,q.y-b.y)<q.r+br+26){g=q;break}}
  if(!g&&b.lt>10)g=p;
  if(g){if(g!==p){const o=g.ball;g.ball=b;p.ball=o;burst(b.x,b.y,14,g.color,280)}b.st='held';b.hit=false;g.cd=Math.max(g.cd,.7);return}
  if(b.hit||v<=260)return;
  for(const q of P){
    if(q===p||!q.alive||q.fall)continue;
    if(Math.hypot(q.x-b.x,q.y-b.y)<q.r+br){
      const imp=Math.min(1,v/760)*950*pw(p)*(b.pw||1)/Math.sqrt(f(q));
      q.kx+=b.vx/v*imp;q.ky+=b.vy/v*imp;
      q.last=p;q.lastT=time;b.hit=true;b.vx*=-.35;b.vy*=-.35;
      if(q===player&&chg.on){chg.on=false;chg.t=0;chg.id=null;q.ch=0}
      burst(b.x,b.y,16,p.color,420);
      const big=p===player||q===player;
      cam.shake=Math.max(cam.shake,big?12+Math.min(p.kills*2,10):4);
      break;
    }
  }
}
function step(dt){
  lock=null;
  if(player&&state==='play'&&player.alive&&!player.fall){
    let jx=stick.x+((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0),jy=stick.y+((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);
    const jm=Math.hypot(jx,jy);if(jm>1){jx/=jm;jy/=jm}
    const cs=chg.on?26:60;player.tx=player.x+jx*cs;player.ty=player.y+jy*cs;
    if(chg.on){if(player.ball.st==='held'){chg.t=Math.min(1,chg.t+dt/1.4);player.ch=chg.t}else{chg.on=false;chg.t=0;player.ch=0}}
    if(Math.hypot(jx,jy)>.2){let da=Math.atan2(jy,jx)-player.aim;da=Math.atan2(Math.sin(da),Math.cos(da));player.aim+=da*Math.min(1,dt*14)}
  }
  for(const p of P)upd(p,dt);
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const a=P[i],b=P[j];if(!a.alive||!b.alive||a.fall||b.fall)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
    if(d<m&&d>0){const o=(m-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o}
  }
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.l-=dt;if(q.l<=0){parts.splice(i,1);continue}q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.95;q.vy*=.95}
  const fp=player&&player.alive?player:null;
  const base=Math.min(W,H)/(700*(1+(fp?(f(fp)-1)*.25:0)));
  if(state==='play'||state==='over'){
    if(fp){cam.x+=(fp.x-cam.x)*Math.min(1,dt*6);cam.y+=(fp.y-cam.y)*Math.min(1,dt*6)}
    cam.s+=(base-cam.s)*Math.min(1,dt*3);
  }else{cam.x*=.95;cam.y*=.95;cam.s=Math.min(W,H)/(1.15*R*2)}
  cam.shake*=Math.exp(-dt*9);
  feed=feed.filter(m=>time-m.t<4);
}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.2832)}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=T.void;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(let i=0;i<70;i++){ctx.globalAlpha=.2+.6*Math.abs(Math.sin(time*1.4+i*1.7));ctx.fillRect(((Math.sin(i*91.7)*.5+.5)*W-cam.x*.06*(1+i%3)+W*40)%W,((Math.sin(i*37.3+5)*.5+.5)*H-cam.y*.06*(1+i%3)+H*40)%H,1+i%3*.7,1+i%3*.7)}
  ctx.globalAlpha=1;
  ctx.save();
  ctx.translate(W/2+(Math.random()-.5)*cam.shake,H/2+(Math.random()-.5)*cam.shake);
  ctx.scale(cam.s,cam.s);ctx.translate(-cam.x,-cam.y);
  const ab=ctx.createRadialGradient(0,0,R,0,0,R+220);ab.addColorStop(0,'rgba(56,244,255,.28)');ab.addColorStop(1,'rgba(56,244,255,0)');
  ctx.fillStyle=ab;circ(0,0,R+220);ctx.fill();
  ctx.fillStyle='#07131f';circ(0,38,R+6);ctx.fill();
  ctx.strokeStyle='#1b6f86';ctx.lineWidth=5;circ(0,38,R+6);ctx.stroke();
  ctx.save();circ(0,0,R);ctx.clip();
  for(let i=-6;i<6;i++){ctx.fillStyle=i%2?'#14683f':'#1a7a49';ctx.fillRect(i*90,-R,90,R*2)}
  ctx.strokeStyle='rgba(120,255,210,.16)';ctx.lineWidth=2;ctx.beginPath();
  for(let g=-R;g<=R;g+=60){ctx.moveTo(g,-R);ctx.lineTo(g,R);ctx.moveTo(-R,g);ctx.lineTo(R,g)}ctx.stroke();
  ctx.strokeStyle='rgba(120,255,255,.7)';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(-R,0);ctx.lineTo(R,0);ctx.stroke();circ(0,0,90);ctx.stroke();
  ctx.fillStyle='rgba(120,255,255,.7)';circ(0,0,8);ctx.fill();
  ctx.restore();
  ctx.save();ctx.shadowColor='#38f4ff';ctx.shadowBlur=26;ctx.strokeStyle='#38f4ff';ctx.lineWidth=7;circ(0,0,R);ctx.stroke();ctx.restore();
  ctx.strokeStyle='rgba(255,61,240,.55)';ctx.lineWidth=3;ctx.setLineDash([14,12]);circ(0,0,R-20);ctx.stroke();ctx.setLineDash([]);
  for(const p of P){if(p.alive)drawBall(p)}
  for(const p of P){if(p.alive)drawP(p)}
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.l/q.m);ctx.fillStyle=q.c;circ(q.x,q.y,q.s);ctx.fill()}
  ctx.globalAlpha=1;ctx.restore();
  hud();drawStick();
}
function drawBall(p){
  const b=p.ball,br=9*f(p),k=1-(p.fall>0?Math.min(p.fall,1):0);
  if(p.fall>0)return;
  const n=b.trail.length;
  for(let i=0;i<n;i++){ctx.globalAlpha=i/n*.5;ctx.fillStyle=p.color;circ(b.trail[i].x,b.trail[i].y,br*(.3+.7*i/n));ctx.fill()}
  ctx.globalAlpha=1;
  const lv=Math.min(p.kills,10)/10,rot=b.st==='held'?p.run*1.5:time*Math.min(12,Math.hypot(b.vx,b.vy)/60);
  if(p.kills>0){
    const ar=br*(1.5+lv*1.8)+Math.sin(time*10)*2.5,g=ctx.createRadialGradient(b.x,b.y,br*.5,b.x,b.y,ar);
    g.addColorStop(0,p.color);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=.4+lv*.45;ctx.fillStyle=g;circ(b.x,b.y,ar);ctx.fill();ctx.globalAlpha=1;
  }
  const cg=p.ch||0,pwr=(b.st!=='held'&&(b.pw||1)>1.15&&Math.hypot(b.vx,b.vy)>380)?((b.pw-1)/.45):0,pc=Math.max(cg,pwr);
  if(pc>0){
    const ar=br*(1.8+pc*2.4)+Math.sin(time*22)*3,g=ctx.createRadialGradient(b.x,b.y,br*.4,b.x,b.y,ar);
    g.addColorStop(0,'#fff8c0');g.addColorStop(.35,'#ffb020');g.addColorStop(.7,'#ff3d5a');g.addColorStop(1,'rgba(255,61,90,0)');
    ctx.globalAlpha=.55+pc*.4;ctx.fillStyle=g;circ(b.x,b.y,ar);ctx.fill();ctx.globalAlpha=1;
  }
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(rot);
  ctx.fillStyle='#fff';circ(0,0,br);ctx.fill();
  ctx.fillStyle='#10153a';ctx.strokeStyle='#10153a';ctx.lineWidth=Math.max(1.5,br*.13);
  ctx.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.5708;ctx.lineTo(Math.cos(a)*br*.42,Math.sin(a)*br*.42)}ctx.closePath();ctx.fill();
  for(let i=0;i<5;i++){const a=i*1.2566-1.5708;ctx.beginPath();ctx.moveTo(Math.cos(a)*br*.42,Math.sin(a)*br*.42);ctx.lineTo(Math.cos(a)*br*.9,Math.sin(a)*br*.9);ctx.stroke()}
  ctx.restore();
  ctx.strokeStyle=p.kills?p.color:'#10153a';ctx.lineWidth=2.5;circ(b.x,b.y,br);ctx.stroke();
}
function drawP(p){
  const k=p.fall>0?Math.max(0,1-p.fall):1,r=p.r*k;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(p.x,p.y+r*.7,r,r*.55,0,0,6.2832);ctx.fill();
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.aim+p.fall*10);ctx.lineCap='round';
  const sk='#f2c29b';
  const ph=p.run,mv=p.mv;
  ctx.fillStyle='#fff';ctx.strokeStyle='#10153a';ctx.lineWidth=2;
  for(const s of[-1,1]){circ(Math.sin(ph+(s>0?0:Math.PI))*r*1.1*mv,s*r*.32,r*.22);ctx.fill();ctx.stroke()}
  for(const s of[-1,1]){
    const hx=r*.1+Math.sin(ph+(s>0?Math.PI:0))*r*.75*mv,hy=s*r*(1+.1*mv);
    ctx.strokeStyle=p.color;ctx.lineWidth=r*.3;ctx.beginPath();ctx.moveTo(0,s*r*.75);ctx.lineTo(hx,hy);ctx.stroke();
    ctx.fillStyle=sk;circ(hx,hy,r*.23);ctx.fill();
  }
  ctx.fillStyle=p.color;circ(0,0,r);ctx.fill();
  ctx.save();circ(0,0,r);ctx.clip();ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(-r*.66,-r,r*.2,r*2);ctx.restore();
  ctx.lineWidth=3.5;ctx.strokeStyle=p===player?'#fff':'#10153a';circ(0,0,r);ctx.stroke();
  if(p.kick>0||p.ch>0){
    const pr=1-p.kick/.24,ex=p.kick>0?(pr<.35?pr/.35:1-(pr-.35)/.65):-p.ch*.55,fx=r*.3+ex*r*1.15,fy=r*.28-ex*r*.1;
    ctx.strokeStyle='#10153a';ctx.lineWidth=r*.34;ctx.beginPath();ctx.moveTo(0,r*.28);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.fillStyle='#fff';ctx.lineWidth=2.5;circ(fx,fy,r*.28);ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,'+(.75*Math.max(0,ex))+')';ctx.lineWidth=r*.12;ctx.beginPath();ctx.arc(0,0,r*1.5,-.9,.9);ctx.stroke();
  }
  const fl=Math.sin(time*14)*r*.12;
  ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(2,r*.1);ctx.beginPath();
  for(const s of[-1,1]){ctx.moveTo(r*.12,s*r*.55);ctx.lineTo(-r*.5,s*(r*.78+fl))}ctx.stroke();
  ctx.fillStyle=sk;circ(r*.1,0,r*.6);ctx.fill();
  ctx.fillStyle='#1b1020';ctx.beginPath();ctx.arc(r*.1,0,r*.6,Math.PI/2,Math.PI*1.5);ctx.closePath();ctx.fill();
  ctx.save();circ(r*.1,0,r*.6);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(r*.02,-r,r*.2,r*2);ctx.restore();
  for(const s of[-1,1]){ctx.strokeStyle='#fff';ctx.lineWidth=r*.16;ctx.beginPath();ctx.moveTo(r*.48,s*r*.07);ctx.lineTo(r*.32,s*r*.28);ctx.stroke();ctx.fillStyle='#d11';circ(r*.42,s*r*.15,r*.06);ctx.fill()}
  ctx.restore();
  if(p.fall<=0){
    ctx.font='15px "Black Han Sans",system-ui,sans-serif';ctx.textAlign='center';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.fillStyle='#fff';
    const s=p.name+(p.kills?' '+p.kills:'');ctx.strokeText(s,p.x,p.y-r-10);ctx.fillText(s,p.x,p.y-r-10);
  }
}
function hud(){
  ctx.font='16px "Black Han Sans",system-ui,sans-serif';
  ctx.textAlign='right';
  const top=P.filter(p=>p.kills>0||p===player).sort((a,b)=>b.kills-a.kills).slice(0,5);
  top.forEach((p,i)=>{ctx.fillStyle=p.color;circ(W-14-ctx.measureText(p.name+'  '+p.kills).width-10,24+i*22,5);ctx.fill();ctx.fillStyle=T.ink;ctx.fillText(p.name+'  '+p.kills,W-14,29+i*22)});
  ctx.textAlign='left';
  if(player&&state==='play'){
    ctx.fillStyle=T.accent;ctx.font='34px "Black Han Sans",system-ui,sans-serif';ctx.fillText('처치 '+player.kills,14,40);
    ctx.fillStyle=T.ink;ctx.font='14px system-ui,sans-serif';ctx.globalAlpha=.7;
    ctx.fillText('파워 x'+pw(player).toFixed(2),14,62);ctx.globalAlpha=1;
  }
  ctx.textAlign='center';ctx.font='15px "Black Han Sans",system-ui,sans-serif';
  feed.slice(-3).forEach((m,i,a)=>{ctx.globalAlpha=Math.min(1,(4-(time-m.t))*1.5);ctx.fillStyle=m.c;ctx.fillText(m.s,W/2,H-26-(a.length-1-i)*20)});
  ctx.globalAlpha=1;
}
function ptr(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{
  const[x,y]=ptr(e),bt=btn();
  if(state==='play'&&Math.hypot(x-bt.x,y-bt.y)<BTR+12){chgStart(e.pointerId);try{cv.setPointerCapture(e.pointerId)}catch(_){}return}
  stick.id=e.pointerId;stick.bx=x;stick.by=y;stick.x=stick.y=stick.sx=stick.sy=0;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==stick.id)return;
  const[x,y]=ptr(e);let dx=x-stick.bx,dy=y-stick.by;const d=Math.hypot(dx,dy);
  if(d>SR){dx*=SR/d;dy*=SR/d}
  stick.sx=dx;stick.sy=dy;stick.x=dx/SR;stick.y=dy/SR;
});
function sEnd(e){if(e.pointerId===chg.id)chgEnd();if(e.pointerId===stick.id){stick.id=null;stick.x=stick.y=stick.sx=stick.sy=0}}
cv.addEventListener('pointerup',sEnd);cv.addEventListener('pointercancel',sEnd);cv.addEventListener('lostpointercapture',sEnd);
addEventListener('pointerup',sEnd);addEventListener('pointercancel',sEnd);
function rst(){stick.id=null;stick.x=stick.y=stick.sx=stick.sy=0;chg.on=false;chg.t=0;chg.id=null;if(player)player.ch=0}
addEventListener('blur',rst);document.addEventListener('visibilitychange',rst);
cv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{keys[e.code]=true;if(state==='play'&&(e.code.startsWith('Arrow')||e.code==='Space'))e.preventDefault();if(e.code==='Space'&&!e.repeat)chgStart('k')});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space'&&chg.id==='k')chgEnd()});
function drawStick(){
  if(state!=='play')return;
  const on=stick.id!==null,bx=on?stick.bx:SR+26,by=on?stick.by:H-SR-40;
  ctx.globalAlpha=on?.95:.5;
  ctx.fillStyle='rgba(140,150,190,.25)';ctx.strokeStyle=T.ink;ctx.lineWidth=3;
  circ(bx,by,SR);ctx.fill();ctx.stroke();
  ctx.fillStyle=T.accent;circ(bx+(on?stick.sx:0),by+(on?stick.sy:0),SR*.45);ctx.fill();ctx.stroke();
  const bt=btn(),rdy=player&&player.ball.st==='held',c=chg.on?chg.t:0,br2=BTR*(chg.on?.94+Math.sin(time*20)*.02*c:1);
  if(c>0){
    ctx.save();ctx.shadowColor=c>.95?'#ffe066':'#ff7a2a';ctx.shadowBlur=14+c*26;ctx.globalAlpha=.9;
    ctx.strokeStyle=c>.95?'#ffe066':'#ff7a2a';ctx.lineWidth=9;ctx.beginPath();ctx.arc(bt.x,bt.y,BTR+12,-1.5708,-1.5708+c*6.2832);ctx.stroke();ctx.restore();
  }
  ctx.globalAlpha=rdy?1:.4;
  ballIcon(bt.x,bt.y,br2,chg.on?time*c*12:0);
  ctx.strokeStyle=rdy?'#ff3d5a':T.ink;ctx.lineWidth=4;circ(bt.x,bt.y,br2);ctx.stroke();
  if(!rdy){ctx.fillStyle='rgba(5,6,26,.45)';circ(bt.x,bt.y,br2);ctx.fill()}
  ctx.globalAlpha=1;
}
function btn(){return{x:W-BTR-24,y:H-BTR-44}}
function kick(ch=0){if(player&&state==='play'){shoot(player,ch);pressT=time}}
function chgStart(id){if(state==='play'&&player&&player.ball.st==='held'&&!chg.on){chg.on=true;chg.t=0;chg.id=id}}
function chgEnd(){if(!chg.on)return;const t=chg.t;chg.on=false;chg.t=0;chg.id=null;if(player)player.ch=0;kick(t<.15?0:t)}
function ballIcon(x,y,r,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.fillStyle='#fff';circ(0,0,r);ctx.fill();circ(0,0,r);ctx.clip();
  ctx.fillStyle='#10153a';ctx.strokeStyle='#10153a';ctx.lineWidth=Math.max(2,r*.07);
  ctx.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.5708;ctx.lineTo(Math.cos(a)*r*.38,Math.sin(a)*r*.38)}ctx.closePath();ctx.fill();
  for(let i=0;i<5;i++){
    const a=i*1.2566-1.5708;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.38,Math.sin(a)*r*.38);ctx.lineTo(Math.cos(a)*r*.75,Math.sin(a)*r*.75);ctx.stroke();
    circ(Math.cos(a+.6283)*r*.95,Math.sin(a+.6283)*r*.95,r*.24);ctx.fill();
  }
  ctx.restore();
}
const nm=document.getElementById('nm');
function start(){
  P=P.filter(p=>p.bot);
  player=mk((nm.value.trim()||'나').slice(0,10),'#4da3ff',false);
  P.push(player);cam.x=player.x;cam.y=player.y;cam.s=Math.min(W,H)/700;
  stick.x=stick.y=0;
  player.aim=Math.atan2(-player.y,-player.x);chg.on=false;chg.t=0;chg.id=null;stick.id=null;stick.x=stick.y=0;state='play';feed=[];ov.classList.add('hide');
}
document.getElementById('go').addEventListener('click',start);
nm.addEventListener('keydown',e=>{if(e.key==='Enter')start()});
let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;time+=dt;step(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
